<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f8fafd" />
    <meta name="description" content="오늘 쓸 수 있는 금액을 알려주는 개인 예산 앱" />
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <title>Orbit — 오늘의 예산</title>
    <script>
      // 첫 페인트 전에 저장된 테마를 입힌다. React가 붙은 뒤에 칠하면 다크 사용자에게
      // 흰 화면이 한 번 번쩍인다. 키는 App.tsx의 THEME_KEY와 같아야 한다.
      try {
        var saved = localStorage.getItem('orbit-theme')
        var dark = saved ? saved === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches
        if (dark) document.documentElement.classList.add('dark')
      } catch (e) { /* 저장소 접근 불가 */ }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
