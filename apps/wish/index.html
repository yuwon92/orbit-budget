<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffd43b" />
    <meta name="description" content="자유비용을 모아 위시를 이루는 목표 관리 앱" />
    <link rel="icon" type="image/svg+xml" href="./wish-icon.svg" />
    <link rel="apple-touch-icon" href="./wish-icon.svg" />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <!-- CDN 폰트는 버전을 고정하고 무결성 해시를 건다. 해시가 안 맞으면 폰트가
         조용히 안 뜨므로, URL을 바꾸면 해시도 함께 다시 계산할 것 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@1.3.9/dist/web/static/pretendard.css" integrity="sha384-SN6A48CJQjx946+DRb8wsoifC4a8ur9ZS6R+HCTgnBHOKCa6GLXAR3Qn8d1jztxg" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/MonadABXY/mona-font@2026.08.16/web/mona.css" integrity="sha384-ZsZkw/jSg7tONEcDyabbWuEoHtqrpMcK9piojDlY3mnSvMiVb3gttX4civPnaH+c" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <title>Orbit Wish — 위시를 현실로</title>
    <script>
      // 첫 페인트 전에 저장된 테마를 입힌다. React가 붙은 뒤에 칠하면 다크 사용자에게
      // 흰 화면이 한 번 번쩍인다. 키는 App.tsx의 THEME_KEY와 같아야 한다.
      try {
        var saved = localStorage.getItem('wish-theme') || localStorage.getItem('wish-lab-theme')
        var dark = saved ? saved === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches
        if (dark) document.documentElement.classList.add('dark')
      } catch (e) { /* 저장소 접근 불가 */ }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
